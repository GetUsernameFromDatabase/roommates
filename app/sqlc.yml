# https://docs.sqlc.dev/en/latest/reference/config.html
version: '2'
sql:
  - engine: 'postgresql'
    queries: './internal/db/queries.sql'
    schema: './internal/db/migrations'
    gen:
      go:
        package: 'dbqueries'
        out: './internal/db/dbqueries'

        sql_package: 'pgx/v5'
        sql_driver: github.com/jackc/pgx/v5

        # https://docs.sqlc.dev/en/latest/howto/vet.html#go
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_exact_table_names: false
        # emit_interface: true # should be useful for mocking
        # emit_all_enum_values: true

# TODO: maybe add this https://docs.sqlc.dev/en/latest/howto/vet.html#sqlcdb-prepare
