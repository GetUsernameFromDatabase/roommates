# yaml-language-server: $schema=https://taskfile.dev/schema.json

# mainly taken from https://shadcn-templ.com/docs/installation#create-taskfile

version: '3'

use_gitignore: true

vars:
  # The app port: an explicit 'task dev PORT=8091' wins, otherwise the next
  # free port from 8090 up. The templ proxy and the app share the result,
  # so hot reload never points at a foreign app.
  FREE_PORT:
    sh: port=8090; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PORT: '{{.PORT | default .FREE_PORT}}'
  TAILWIND_INPUT: './web/assets/globals.css'
  TAILWIND_OUTPUT: './web/assets/public/output.css'
  # the only pin: deploy/app/Dockerfile downloads this version via 'task tailwind-version'
  TAILWIND_VERSION: '4.3.3'
  PROXY_TLS_CRT: './certificates/server.pem'
  PROXY_TLS_KEY: './certificates/server.key'

tasks:
  templ:
    desc: Run templ generate on changes and signal the server to restart
    cmds:
      # I could not get this to work properly
      # https://templ.guide/developer-tools/live-reload#templ-uses-a-proxy-to-auto-reload-the-browser
      # the server runs in the server task, see scripts/dev-signal.sh for why
      - go tool templ generate --watch --open-browser=false --cmd="sh ./scripts/dev-signal.sh"

  server:
    desc: Run the server under dlv, restarted on every templ signal
    cmds:
      - sh ./scripts/dev-run.sh
    env:
      SERVER_PORT: '{{.PORT}}'
    dotenv:
      - ../.env

  tailwind:
    desc: Watch Tailwind CSS changes
    preconditions: &tailwind-pinned
      # --help colours the version even when piped, so no -w; the digit guard keeps 4.3.3 from matching 4.3.30
      - sh: tailwindcss --help | grep -qE 'v{{.TAILWIND_VERSION}}([^0-9]|$)'
        msg: 'tailwindcss must be v{{.TAILWIND_VERSION}}: https://github.com/tailwindlabs/tailwindcss/releases/tag/v{{.TAILWIND_VERSION}}'
    cmds:
      - 'tailwindcss -i {{.TAILWIND_INPUT}} -o {{.TAILWIND_OUTPUT}} --watch'

  tailwind-version:
    desc: Print the pinned tailwindcss version (read by deploy/app/Dockerfile)
    silent: true
    cmds:
      - echo {{.TAILWIND_VERSION}}

  scripts-watch:
    desc: Watch component scripts
    cmds:
      - go tool shadcn-templ bundle --watch

  # TODO: add sqlc https://docs.sqlc.dev/en/latest/reference/cli.html
  # does not seem to have simple --watch like templ generate
  # ust running it manualy should suffice, go files are watched
  # sqlc generate --help

  vendor:
    desc: Download third-party assets from web/assets/vendor.json, no network once present
    cmds:
      - go run ./tools/vendor-assets

  build:
    desc: Build the application with production assets
    preconditions: *tailwind-pinned
    cmds:
      - task: vendor
      - sqlc generate
      - go generate ./tools/...
      - tailwindcss -i {{.TAILWIND_INPUT}} -o {{.TAILWIND_OUTPUT}} --minify
      - go tool shadcn-templ bundle
      - go tool templ generate
      - go build -o bin/app ./cmd/server

  dev:
    env:
      SHADCN_TEMPL_DEV: 'true'
    desc: Start development server with hot reload
    cmds:
      - docker compose -f ../docker-compose.yml up -d --wait db rustfs
      - task --parallel tailwind scripts-watch templ server
