    account-erased-body: |-
      Hi %s,

      your Roommates account and personal data have been erased. What you shared in households stays there under "Former member".
    data-export-subject: Your data is ready to download
    data-export-body: |-
      Hi %s,

      your Roommates data export is ready. Download it until %s from this link (you need to be signed in):
      %s

