# https://docs.docker.com/compose/
# Reminders for myself so I won't need to check every time (panic mode during error)
# ports: first port is for outside container use, the other inside container
# env is automatically loaded, you can just use interpolation
#  if you don't want to bind the entire file to service
#  https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/#env-file
version: "3"

volumes:
  db_data:
  rustfs_data:

services:
  # --- STORAGE ---
  db:
    command: -c config_file=/etc/postgresql.conf
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    restart: always
    ports:
      # not 5432, so a stopped container fails loudly instead of reaching a system postgres
      - 127.0.0.1:5433:5432
    environment:
      # https://hub.docker.com/_/postgres/#environment-variables
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # REQUIRED
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./deploy/postgres/postgresql.conf:/etc/postgresql.conf # should match with command: -c config_file
      - db_data:/var/lib/postgresql # PG 18 path
      - ./logs/postgresql:/logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  # files, an S3 API on :9000, console at http://127.0.0.1:9001
  rustfs:
    build:
      context: ./deploy/rustfs
      dockerfile: Dockerfile
    restart: always
    ports:
      - 127.0.0.1:9000:9000 # S3 API
      - 127.0.0.1:9001:9001 # console
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY} # REQUIRED
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY} # REQUIRED
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  # --- EMAIL (development) ---
  # catches every email, inbox at http://127.0.0.1:8025
  # for `task dev` set SMTP_HOST=localhost SMTP_PORT=1025 in .env
  mailpit:
    build:
      context: ./deploy/mailpit
      dockerfile: Dockerfile
    restart: always
    ports:
      - 127.0.0.1:1025:1025 # SMTP
      - 127.0.0.1:8025:8025 # web inbox
  # ----------------------------------------------------------------------------
  app:
    depends_on:
      db:
        condition: service_healthy
        required: true
        restart: true
      rustfs:
        condition: service_healthy
        required: true
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      # match latter with [SERVER_PORT] env
      - 127.0.0.1:8000:8080
    volumes:
      # the TLS key stays out of the image, see app/.dockerignore
      - ./app/certificates:/app/certificates:ro
    env_file: .env
    environment:
      SERVER_PORT: 8080
      # https://gin-gonic.com/en/docs/faq/#how-do-i-run-gin-in-production-mode
      GIN_MODE: release
      # match with service
      DATABASE_HOST: db # service name
      DATABASE_PORT: 5432 # service container port
      # emails go to the mailpit service, replace for real delivery
      S3_ENDPOINT: http://rustfs:9000 # service name and container port
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Roommates <noreply@localhost>
      APP_BASE_URL: https://127.0.0.1:8000
